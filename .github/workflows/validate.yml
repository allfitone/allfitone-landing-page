name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:brand
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run ambassador:check
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-linux-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - name: Run canonical visual snapshots
        shell: cmd
        run: npm run test:e2e -- --grep "@visual"
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-windows-visual-diffs
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
