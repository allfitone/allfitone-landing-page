name: Deploy

# Ships main to S3 and CloudFront once Validate has passed for that commit.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Hashed assets never change under the same name; pages are revalidated on every visit.
      - name: Upload
        run: |
          aws s3 sync out/_next/static "s3://${{ vars.SITE_BUCKET }}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync out "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidate
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths "/*"
